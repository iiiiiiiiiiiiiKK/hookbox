name: Deploy to Cloudflare Pages

# One-click redeploy. Add these repository secrets first:
#   CLOUDFLARE_API_TOKEN  – token with Pages:Edit, D1:Edit, Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID – your account id
#   AUTH_PEPPER           – server-side pepper (only needed for the very first deploy;
#                           leave it unset afterwards to keep existing inbox tokens valid)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply hookbox-db --remote

      - name: Build and deploy
        run: node scripts/deploy-pages.mjs

      - name: Smoke test the deployment
        run: node scripts/verify-live.mjs https://hookbox.pages.dev
